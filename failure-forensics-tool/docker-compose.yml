services:
  api:
    build: .
    # TODO: uncomment once feedback_api.py is implemented
    # command: uvicorn src.feedback_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./traces:/app/traces
  dashboard:
    build: .
    # TODO: uncomment once dashboard/app.py is implemented
    # command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./traces:/app/traces
    depends_on:
      - api
